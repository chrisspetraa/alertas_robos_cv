# =====================================================================
#  CONFIGURACIÓN DEL BOT DE ALERTAS DE ROBOS (Comunitat Valenciana)
#  Puedes editar este fichero sin tocar el código (bot.py).
#  Las palabras se comparan sin tildes ni mayúsculas.
#  Un asterisco al final (asalt*) significa "cualquier terminación".
# =====================================================================

ajustes:
  max_edad_horas: 36            # ignora noticias más antiguas que esto
  primera_ejecucion_max: 5      # en la 1ª ejecución solo envía las N más recientes (el resto se marca como vista)
  max_alertas_por_ejecucion: 15 # freno de seguridad: si hay más, el resto sale en la siguiente ejecución
  timeout_segundos: 20
  similitud_titulos: 0.5        # 0-1. Titulares parecidos (misma noticia en varios medios) se envían una sola vez
  retencion_dias: 10            # cuánto tiempo recuerda las noticias ya enviadas
  vista_previa_enlace: false    # true = Telegram muestra tarjeta con imagen del enlace
  archivo_estado: state/state.json
  user_agent: "Mozilla/5.0 (compatible; AlertasRobosCV/1.0; lector RSS de uso personal)"

# ---------------------------------------------------------------------
#  QUÉ SE CONSIDERA UN AVISO
#  Una noticia salta si contiene algún término de "delitos" Y algún
#  término de "lugares" de una categoría ACTIVA.
#  Ahora mismo solo está activa "viviendas" (lo que pediste).
#  Para añadir otras, cambia "activa: false" por "activa: true".
# ---------------------------------------------------------------------
categorias:
  viviendas:
    activa: true
    etiqueta: Robo en vivienda
    icono: "🏠"
    delitos: &delitos
      - robo
      - robos
      - robar
      - robaba
      - robaban
      - robaron
      - robado
      - robados
      - robada
      - robadas
      - roba
      - roban
      - robando
      - robara
      - robaran
      - atraco*
      - asalt*
      - ladron*
      - butron*
      - allanamiento*
      - allanar*
      - allanaron
      - desvalij*
      - saqueo*
      - saquear*
      - saquearon
      - sustra*
      - hurto*
      - hurtar*
    lugares:
      - vivienda*
      - casa
      - casas
      - casita*
      - chalet
      - chalets
      - chale
      - chales
      - domicilio*
      - piso
      - pisos
      - adosado*
      - urbanizacion*
      - segunda residencia
      - segundas residencias
      - morada*
      - inmueble*
      - villa
      - villas
      - bungalow*
      - apartamento*
      - hogar*
      - alqueria*
      - masia*

  comercios:
    activa: false
    etiqueta: Robo en comercio o empresa
    icono: "🏪"
    delitos: *delitos
    lugares:
      - comercio*
      - tienda*
      - negocio*
      - bar
      - bares
      - restaurante*
      - empresa*
      - nave
      - naves
      - local
      - locales
      - oficina*
      - gasolinera*
      - farmacia*
      - estanco*
      - joyeria*
      - supermercado*
      - establecimiento*
      - almacen*
      - cajero*

  vehiculos:
    activa: false
    etiqueta: Robo de vehículo
    icono: "🚗"
    delitos: *delitos
    lugares:
      - coche
      - coches
      - vehiculo*
      - moto
      - motos
      - motocicleta*
      - furgoneta*
      - camion*
      - catalizador*

# Si el texto contiene alguno de estos términos, se descarta (falsos positivos habituales)
exclusiones:
  - robo de identidad
  - robo de datos
  - robo de contrasenas
  - robo de cuentas
  - ciberataque*
  - phishing
  - hackeo*
  - arbitr*
  - var
  - penalti*
  - laliga
  - champions league
  - futbol*
  - pelicula*
  - videojuego*
  - novela*

