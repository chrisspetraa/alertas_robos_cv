# ---------------------------------------------------------------------
#  FUENTES
#  - feeds:     direcciones RSS conocidas (se prueban todas).
#  - descubrir: páginas de la web desde las que el bot busca solo el RSS
#               si "feeds" está vacío o ninguno funciona.
#  - ambito:    regional = medio de la Comunitat (se descartan solo las que
#               nombren otra zona) | nacional = exige mencionar un lugar de la Comunitat.
#  - tipo:      directa | agregador (Google/Bing News; se procesan después
#               de las directas para preferir el enlace del propio medio).
#  "verificada: true" = el feed se comprobó a mano el 19/09/2026.
#  El resto se prueba automáticamente al ejecutar; mira el resumen de la
#  ejecución en GitHub Actions para ver cuáles funcionan.
# ---------------------------------------------------------------------
fuentes:
  - nombre: El Periódico de Aquí
    verificada: true
    ambito: regional
    feeds:
      - url: https://www.elperiodic.com/feed/noticias/rss-sucesos.xml
      - url: https://www.elperiodic.com/feed/valencia/noticias/rss-sucesos.xml
        provincia: Valencia
      - url: https://www.elperiodic.com/feed/alicante/noticias/rss-sucesos.xml
        provincia: Alicante
      - url: https://www.elperiodic.com/feed/castellon/noticias/rss-sucesos.xml
        provincia: Castellón
      - url: https://www.elperiodic.com/feed/rss_valencia.xml
        provincia: Valencia
      - url: https://www.elperiodic.com/feed/rss_alicante.xml
        provincia: Alicante
      - url: https://www.elperiodic.com/feed/rss_castellon.xml
        provincia: Castellón

  - nombre: Levante-EMV
    ambito: regional
    feeds: []
    descubrir:
      - https://www.levante-emv.com/sucesos/
      - https://www.levante-emv.com/rss/
      - https://www.levante-emv.com/

  - nombre: Las Provincias
    ambito: regional
    feeds: []
    descubrir:
      - https://www.lasprovincias.es/sucesos/
      - https://www.lasprovincias.es/rss/
      - https://www.lasprovincias.es/

  - nombre: Información (Alicante)
    ambito: regional
    default_provincia: Alicante
    feeds: []
    descubrir:
      - https://www.informacion.es/sucesos/
      - https://www.informacion.es/rss/
      - https://www.informacion.es/

  - nombre: El Periódico Mediterráneo (Castellón)
    ambito: regional
    default_provincia: Castellón
    feeds: []
    descubrir:
      - https://www.elperiodicomediterraneo.com/sucesos/
      - https://www.elperiodicomediterraneo.com/rss/
      - https://www.elperiodicomediterraneo.com/

  - nombre: Cadena SER Comunitat Valenciana
    ambito: nacional
    feeds: []
    descubrir:
      - https://cadenaser.com/comunitat-valenciana/
      - https://cadenaser.com/rss/

  - nombre: Valencia Plaza
    ambito: regional
    feeds:
      - https://valenciaplaza.com/rss
    descubrir:
      - https://valenciaplaza.com/

  - nombre: Alicante Plaza
    ambito: regional
    default_provincia: Alicante
    feeds: []
    descubrir:
      - https://alicanteplaza.es/

  - nombre: Castellón Plaza
    ambito: regional
    default_provincia: Castellón
    feeds: []
    descubrir:
      - https://castellonplaza.com/

  - nombre: À Punt Mèdia
    ambito: regional
    feeds: []
    descubrir:
      - https://apuntmedia.es/

  - nombre: Europa Press Comunitat Valenciana
    ambito: nacional
    feeds: []
    descubrir:
      - https://www.europapress.es/comunitat-valenciana/

  - nombre: La Verdad (Alicante)
    ambito: nacional
    feeds: []
    descubrir:
      - https://www.laverdad.es/alicante/

  # ---- Buscadores de noticias (cubren cientos de medios con una sola consulta) ----
  # Se procesan los últimos, para preferir el enlace directo del propio medio.
  - nombre: Google Noticias
    tipo: agregador
    ambito: nacional
    feeds:
      - google_news: "(robo OR robos OR robar OR asalto OR ladrones) (vivienda OR viviendas OR chalet OR chalets OR domicilio) Valencia when:1d"
        provincia: Valencia
      - google_news: "(robo OR robos OR robar OR asalto OR ladrones) (vivienda OR viviendas OR chalet OR chalets OR domicilio) Alicante when:1d"
        provincia: Alicante
      - google_news: "(robo OR robos OR robar OR asalto OR ladrones) (vivienda OR viviendas OR chalet OR chalets OR domicilio) Castellón when:1d"
        provincia: Castellón
      - google_news: "(robo OR robos OR robar OR asalto OR ladrones) (chalet OR chalets OR urbanización) \"Comunitat Valenciana\" when:1d"
      - google_news: "(robos OR robar OR ladrones) (chalets OR viviendas) (Torrevieja OR Benidorm OR Orihuela OR Jávea OR Dénia OR Calpe OR Altea) when:1d"
        provincia: Alicante

  - nombre: Bing Noticias
    tipo: agregador
    ambito: nacional
    feeds:
      - bing_news: "robo vivienda chalet Valencia"
        provincia: Valencia
      - bing_news: "robo vivienda chalet Alicante"
        provincia: Alicante
      - bing_news: "robo vivienda chalet Castellón"
        provincia: Castellón
